      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
      - name: Require completed build
        if: ${{ steps.stage.outputs.finished != 'true' }}
        shell: pwsh
        run: throw "Build did not produce the portable package after the final stage."
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  publish-release:
    needs: [build-16]
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.build-16.outputs.finished == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download x64 package
        uses: actions/download-artifact@v4
        with:
          name: chromium
          path: release-staging

      - name: Create portable ZIP
        run: |
          test -f release-staging/chromePortable/chrome.exe
          test -f release-staging/chromePortable/portable.flag
          cd release-staging
          zip -qr ../chromePortable.zip chromePortable

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          fail_on_unmatched_files: true
          files: |
            chromePortable.zip
          body: |
            ## 🚀 Ungoogled Chromium for Windows

            ### 📦 Download
            - **chromePortable.zip** - portable browser in the `chromePortable` folder

            ### ✨ Features
            - ✅ Portable profile in `chromePortable/UserData`
            - ✅ `Launch.bat` starts the browser without encryption-disabling command-line switches

            ### 📖 Installation
            Extract `chromePortable.zip` and run `Launch.bat`.
